<!DOCTYPE html>
<html>
<head>
    <title>My Shirt Shop</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background: black;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 24px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .product {
            background: white;
            width: 200px;
            margin: 15px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background: black;
            color: white;
            border: none;
            padding: 8px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: gray;
        }
    </style>
</head>
<body>

<header>
    🛍 My Shirt Shop
</header>

<div class="container">

    <div class="product">
        <img src="https://via.placeholder.com/200">
        <h3>Black Shirt</h3>
        <p class="price">1200 PKR</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200">
        <h3>White Shirt</h3>
        <p class="price">1000 PKR</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200">
        <h3>Blue Shirt</h3>
        <p class="price">1500 PKR</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
